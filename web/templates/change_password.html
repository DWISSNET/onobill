{{define "content"}}
<div class="topbar">
    <h1>🔑 Ganti Password</h1>
</div>

<div class="card" style="max-width:480px">
    {{if .Success}}
    <div style="background:#ecfdf5;border:1px solid #10b981;color:#065f46;padding:12px;border-radius:8px;margin-bottom:14px">
        ✅ Password berhasil diubah!
    </div>
    {{end}}
    {{if .Error}}
    <div style="background:#fef2f2;border:1px solid #ef4444;color:#991b1b;padding:12px;border-radius:8px;margin-bottom:14px">
        ❌ {{.Error}}
    </div>
    {{end}}

    <p class="text-muted" style="margin-bottom:14px">Akun: <strong>{{.Email}}</strong></p>

    <form method="POST" action="/settings/password">
        <div class="form-group">
            <label class="form-label">Password Lama *</label>
            <input type="password" name="old_password" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label">Password Baru *</label>
            <input type="password" name="new_password" class="form-input" minlength="4" required>
        </div>
        <div class="form-group">
            <label class="form-label">Konfirmasi Password Baru *</label>
            <input type="password" name="confirm_password" class="form-input" minlength="4" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Simpan Password Baru</button>
    </form>
</div>
{{end}}

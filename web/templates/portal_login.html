<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #fff; padding: 40px; border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 400px;
        }
        .logo { text-align: center; font-size: 32px; font-weight: 700; margin-bottom: 8px; color: #1a1a2e; }
        .logo span { color: #4ade80; }
        .subtitle { text-align: center; color: #6b7280; margin-bottom: 32px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #374151; }
        .form-input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        .form-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .btn-login { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-login:hover { background: #2563eb; }
        .alert-error { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; border: 1px solid #ef4444; }
        .hint { margin-top: 24px; padding: 12px; background: #f9fafb; border-radius: 6px; font-size: 13px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">ONO<span>BILL</span></div>
        <div class="subtitle">Portal Pelanggan — Cek &amp; Bayar Tagihan Anda</div>

        {{if .Error}}<div class="alert-error">{{.Error}}</div>{{end}}

        <form method="POST" action="/portal/login">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-input" placeholder="username pelanggan" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Masuk</button>
        </form>

        <div class="hint">Gunakan username &amp; password yang diberikan admin ISP Anda.</div>
    </div>
</body>
</html>
